<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>扁平烟花 · 样式预览</title><link rel="icon" href="./assets/favicon.svg"><link rel="stylesheet" href="./flat-preview.css?v=503ad3f29326"></head>
<body><main>
 <header><a href="./">返回体验</a><h1>扁平烟花<span>样式预览</span></h1><p>当前 3 种样式。告诉我编号，就能确定保留哪些。</p></header>
 <nav class="controls" aria-label="播放控制"><button id="toggle" type="button">暂停</button><button id="replay" type="button">重新播放</button><label class="timeline"><span class="sr-only">播放进度</span><input id="timeline" type="range" min="0" max="4.8" step="0.01" value="0"><output id="clock">0.00 s</output></label></nav>
 <section id="styles" class="grid" aria-label="三种烟花预览"></section>
 <footer><p id="selection" aria-live="polite">可在卡片下方标记，也可以直接告诉我编号。</p><button id="copy" type="button" disabled>复制选择</button></footer>
 <p class="error" id="error" role="alert" hidden></p>
</main>
<dialog id="detail"><div class="detail-head"><h2 id="detail-title"></h2><button id="close" type="button" aria-label="关闭放大预览">关闭</button></div><canvas id="detail-canvas" width="960" height="840" aria-label="放大烟花预览"></canvas><button id="detail-replay" type="button">重新播放</button></dialog>
<script type="module" src="./flat-preview.mjs?v=503ad3f29326"></script></body></html>
