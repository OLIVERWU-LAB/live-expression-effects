<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="description" content="Vibe Coding 直播特效。以表情实时触发雨滴与烟花，支持三种视觉风格。"><title>Vibe Coding · 直播特效</title><link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"></head><body>
<main class="stage" id="stage" aria-label="全屏表情互动"><video id="camera" autoplay playsinline muted aria-label="摄像头实时画面"></video><canvas id="scene" aria-label="雨滴、积水与烟花"></canvas><canvas id="optics" aria-label="雨滴与人物光照"></canvas><div class="vignette"></div>
<header class="topbar"><nav class="version-switch" aria-label="特效风格"><button data-style="cinema" aria-pressed="true"><span>01</span> 写实</button><button data-style="gift" aria-pressed="false"><span>02</span> 礼物</button><button data-style="flat" aria-pressed="false"><span>03</span> 扁平</button></nav><div class="top-actions"><button class="icon-button sound-toggle" id="sound-toggle" aria-label="开启声音" title="开启声音" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4Z"/><path class="sound-waves" d="M15 8c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/><path class="sound-slash" d="m15 9 6 6m0-6-6 6"/></svg></button><button class="icon-button" id="fullscreen" aria-label="进入全屏" title="进入全屏"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button><button class="icon-button" id="toggle-ui" aria-label="隐藏界面" title="隐藏界面" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.4-6.3 9.5-6.3 9.5 6.3 9.5 6.3-3.4 6.3-9.5 6.3S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/><path class="eye-slash" d="m4 4 16 16"/></svg></button></div></header><button id="resume-camera" class="camera-entry" hidden aria-label="开启摄像头">预览</button><div hidden><div class="status-cluster"><span class="live-pill"><i id="live-dot"></i><span id="source-label">CAMERA OFF</span></span><span class="status-copy" id="status-copy">表情互动特效</span></div><button id="settings-button"></button><button id="stop-camera"></button></div>
<nav class="pattern-picker" id="pattern-picker" aria-label="锁定播放"><span class="pattern-caption">锁定播放</span><button type="button" data-playback="rain" aria-pressed="false"><svg class="filled-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M11.3 2.2C9.8 5 4.7 10.7 4.7 15.2a6.6 6.6 0 0 0 13.2 0c0-4.5-5.1-10.2-6.6-13ZM8.4 12.3c-.7 1-1 2.1-1 3.1 0 1.5.8 2.6 2 3.1.6.3 1.2-.6.6-1-1-.6-1.3-1.3-1.3-2.2 0-.8.2-1.6.6-2.4.4-.6-.5-1.2-.9-.6Z"/><path opacity=".5" d="M20 5.7c-.7 1.2-2.2 3-2.2 4.5a2.2 2.2 0 0 0 4.4 0c0-1.5-1.5-3.3-2.2-4.5Z"/></svg><span>雨滴</span><i aria-hidden="true"></i></button><button type="button" data-playback="fireworks" aria-pressed="false"><svg class="filled-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 6.6 1.6 3.8 3.8 1.6-3.8 1.6-1.6 3.8-1.6-3.8L6.6 12l3.8-1.6L12 6.6ZM11.1 1.6h1.8v3.1h-1.8zM11.1 19.3h1.8v3.1h-1.8zM1.6 11.1h3.1v1.8H1.6zM19.3 11.1h3.1v1.8h-3.1z"/><path opacity=".65" d="m5.2 3.9 2.2 2.2L6.1 7.4 3.9 5.2Zm12.7 12.7 2.2 2.2-1.3 1.3-2.2-2.2Zm2.2-11.4-2.2 2.2-1.3-1.3 2.2-2.2ZM7.4 17.9l-2.2 2.2-1.3-1.3 2.2-2.2Z"/></svg><span>烟花</span><i aria-hidden="true"></i></button></nav>
<section class="welcome" id="welcome"><h1>Vibe Coding<span>直播特效</span></h1><p class="welcome-copy">通过表情控制雨滴与烟花。</p><button id="start-camera" class="start-button"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3Z"/></svg><span>开启摄像头</span></button><button id="start-preview" class="preview-link">预览效果 <span aria-hidden="true">↗</span></button></section>
<div class="loading" id="loading" role="status" aria-live="polite" hidden><span class="loading-spinner"></span><span id="loading-copy"></span><small id="loading-detail" hidden></small><button id="loading-retry" hidden>重新加载</button><button id="loading-diagnostics" hidden>复制诊断</button></div><div class="face-hint" id="face-hint" hidden><span>⌖</span><p>让脸部进入画面</p></div><div class="notice" id="notice" role="status" hidden></div>
<section class="hud" id="hud" hidden aria-label="笑容强度控制"><svg class="smile-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20ZM7.5 8.6a1.2 1.2 0 1 0 2.4 0 1.2 1.2 0 0 0-2.4 0Zm6.6 0a1.2 1.2 0 1 0 2.4 0 1.2 1.2 0 0 0-2.4 0Zm-6.8 4.7c-.7 0-1 .6-.7 1.2a6 6 0 0 0 10.8 0c.3-.6 0-1.2-.7-1.2-.3 0-.6.2-.8.5a4.3 4.3 0 0 1-7.8 0c-.2-.3-.5-.5-.8-.5Z"/></svg><div class="gauge" id="smile-gauge" role="meter" aria-label="笑容强度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="gauge-colors"><span class="zone-rest"></span><span class="zone-rain"></span><span class="zone-fire"></span></div><i class="gauge-cursor" id="gauge-cursor"></i><input type="range" min="0" max="100" value="35" id="preview-strength" aria-label="预览笑容强度" hidden></div><div class="strength"><strong id="strength-value">0</strong><span>%</span></div><div hidden id="preview-control"><span id="effect-name"></span><button data-strength="0">停止</button><button data-strength="35">微笑35%</button><button data-strength="85">大笑85%</button></div></section>
<div hidden id="bottom-note">开启摄像头以使用表情控制。</div>
<aside class="settings" id="settings" hidden aria-label="体验设置"><div class="settings-title"><strong>体验设置</strong><button id="close-settings" aria-label="关闭设置">×</button></div><div class="setting-row"><span>声音</span><span id="sound-status">点击右上角开启</span></div><label class="setting-row"><span>显示碰撞轮廓</span><input id="show-tracking" type="checkbox"></label><div class="setting-row"><span>手部碰撞</span><span id="hand-status">准备中</span></div><div class="setting-row"><span>模型缓存</span><span id="cache-status">首次识别后自动保存</span></div><p>首次需要准备识别组件；之后优先使用本机缓存。短暂切走会暂停识别，回来自动接续。</p><div class="setting-row"><span>光学合成</span><span id="optics-status">准备中</span></div><details><summary>运行状态</summary><div class="metrics"><span>画面帧率<b id="diag-fps">—</b></span><span>识别耗时<b id="diag-inference">—</b></span><span>活动粒子<b id="diag-particles">0</b></span><span>碰撞次数<b id="diag-collisions">0</b></span><span>积水水位<b id="diag-water">0</b></span><span>输入来源<b id="diag-source">未启动</b></span><span>合成耗时<b id="diag-render">—</b></span><span>升空烟花<b id="diag-rockets">0</b></span><span>当前花型<b id="diag-pattern">—</b></span><span>活动音源<b id="diag-audio">0</b></span></div><button class="export-button" id="export-session">导出运行记录 ↗</button></details><p class="settings-foot">只以笑容强度驱动特效；不使用张口幅度或麦克风。预览使用模拟信号，摄像头模式使用真实识别。</p></aside>
</main><script type="module" src="./app.mjs"></script></body></html>
